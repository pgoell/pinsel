name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - name: Qt and the OpenGL and xkbcommon headers it needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl-dev libxkbcommon-dev
          mise run install-qt
      - name: vcpkg
        run: mise run install-vcpkg
      - name: clang-format and clang-tidy
        run: mise run lint
      - name: File size
        run: scripts/check-file-size
      - name: Fan-out
        run: scripts/check-fan-out --all

  test:
    name: Test
    runs-on: windows-latest
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
        with:
          install_args: cmake ninja uv pipx:aqtinstall
      - name: Qt
        run: mise run install-qt
      - name: vcpkg
        run: mise run install-vcpkg
      - name: Put the sanitizer runtime on PATH
        shell: pwsh
        run: Join-Path (clang++ -print-resource-dir) 'lib\windows' | Add-Content $env:GITHUB_PATH
      - name: CTest
        run: mise run test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/dev/screenshots/*.png
          if-no-files-found: error

  # Posts the Test job's PNGs to the pull request. GitHub has no API to attach
  # an image to a comment, so the job commits them to the `screenshots` branch
  # and links them. It needs write access, so it runs no code from the pull
  # request: it only handles the PNGs. A fork's or Dependabot's run gets a
  # read-only token, so the job skips those.
  screenshots:
    name: Screenshots
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: shots
      - name: Commit to the screenshots branch
        run: |
          gh auth setup-git
          git init -q pub && cd pub
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git fetch -q --depth 1 origin screenshots; then git checkout -q FETCH_HEAD; else git checkout -q --orphan screenshots; fi
          mkdir -p "$SHA" && cp ../shots/*.png "$SHA/"
          git add "$SHA"
          git commit -qm "screenshots for $SHA"
          # Another pull request may push first; its files are in other folders.
          git push -q origin HEAD:screenshots || { git pull -q --rebase origin screenshots && git push -q origin HEAD:screenshots; }
      - name: Post or update the comment
        run: |
          body="<!-- screenshots -->"$'\n'"**Screenshots** of ${SHA:0:7}"$'\n'
          for f in shots/*.png; do
            n=$(basename "$f")
            body+=$'\n'"![$n](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/screenshots/$SHA/$n)"
          done
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- screenshots -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"
          fi

  commits:
    name: Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Conventional commits
        run: mise run check-commits

  review:
    name: ${{ matrix.name }}
    needs: [lint, test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: review
            name: Review
          - kind: security
            name: Security
    env:
      KIND: ${{ matrix.kind }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      APPROVERS: pgoell
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: decide
        env:
          RUN: >-
            ${{ needs.lint.result == 'success' && needs.test.result == 'success' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            !github.event.pull_request.draft }}
        run: |
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          if [ "$RUN" != true ]; then echo "No round: a fork, Dependabot, a draft, or Lint or Test did not pass." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.decide.outputs.run == 'true'
        run: |
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Out of the checkout, where the reviewer's git cannot write over it.
      - if: steps.decide.outputs.run == 'true'
        run: cp .github/review/round.sh .github/review/context.sh "$RUNNER_TEMP/"
      - id: base
        if: steps.decide.outputs.run == 'true'
        run: echo "sha=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
      - id: round
        if: steps.decide.outputs.run == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: bash "$RUNNER_TEMP/round.sh" plan
      - if: steps.round.outputs.stop == 'false'
        run: bash "$RUNNER_TEMP/context.sh"
      - id: prompt
        if: steps.round.outputs.stop == 'false'
        env:
          FROM: ${{ steps.round.outputs.from }}
          ROUND: ${{ steps.round.outputs.round }}
          MAX: ${{ steps.round.outputs.max }}
        run: |
          {
            echo 'text<<PROMPT_END'
            echo "Round $ROUND of $MAX. FROM: $FROM. HEAD: $HEAD_SHA."
            echo
            sed -e "s|{FROM}|$FROM|g" ".github/review/$KIND.md"
            echo 'PROMPT_END'
          } >> "$GITHUB_OUTPUT"
      - if: steps.round.outputs.stop == 'false'
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5
            --disallowedTools "Read(./.git/**)"
            --allowedTools "Read(./**),Write(./.review/summary.md),Edit(./.review/summary.md),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git ls-files:*),mcp__github_inline_comment__create_inline_comment"
      - if: steps.round.outputs.stop == 'false'
        run: |
          if [ -s .review/summary.md ]; then
            gh pr comment "$PR" --body-file .review/summary.md
          else
            echo "The reviewer wrote no summary." >&2
            exit 1
          fi
      - if: steps.round.outputs.rerun == 'false'
        env:
          ROUND: ${{ steps.round.outputs.round }}
          FROM: ${{ steps.round.outputs.from }}
          COMMENT_ID: ${{ steps.round.outputs.comment_id }}
        run: bash "$RUNNER_TEMP/round.sh" record
