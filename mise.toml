# mise.toml: toolchain pins and task definitions

[tools]
cmake     = "latest"
ninja     = "latest"
# uv runs the pipx backend. clang-format and clang-tidy stay on one major
# version, so a new release does not reformat the code or add findings.
uv        = "latest"
"pipx:clang-format" = "23"
"pipx:clang-tidy"   = "23"
lefthook  = "latest"
cocogitto = "latest"
jq        = "latest"
"pipx:aqtinstall" = "3.3.0"

# ─── Bootstrap ──────────────────────────────────────────────────────────────

[tasks.install]
description = "Install git hooks and dependencies"
run = [
  "lefthook install",
  "cmake --preset dev",
]

# aqtinstall 3.3.0 cannot read the Windows layout of Qt 6.11 and newer.
# In CI the task also points CMake at the new Qt; elsewhere set CMAKE_PREFIX_PATH
# in mise.local.toml to the folder it prints.
[tasks.install-qt]
description = "Download Qt into .qt/ for this OS"
shell = "bash -c"
run = '''
version=6.10.3
case "$(uname -s)" in
  Linux) host=linux arch=linux_gcc_64 dir=gcc_64 archives="qtbase qtsvg icu" ;;
  *) host=windows arch=win64_msvc2022_64 dir=msvc2022_64 archives="qtbase qtsvg" ;;
esac
aqt install-qt "$host" desktop "$version" "$arch" --outputdir .qt --archives $archives
prefix="$(pwd -W 2>/dev/null || pwd)/.qt/$version/$dir"
echo "Qt is in $prefix"
if [ -n "${GITHUB_ENV:-}" ]; then
  echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
  echo "$prefix/bin" >> "$GITHUB_PATH"
fi
'''

# ─── Build & test ───────────────────────────────────────────────────────────

# The dev preset builds Debug with AddressSanitizer and UndefinedBehaviorSanitizer.
[tasks.build]
description = "Configure and build the dev preset"
run = [
  "cmake --preset dev",
  "cmake --build --preset dev",
]

[tasks.test]
description = "Run tests under the sanitizers"
depends = ["build"]
run = "ctest --preset dev"

# ─── Lint & format ──────────────────────────────────────────────────────────

# clang-tidy reads build/dev/compile_commands.json, which the configure writes.
[tasks.lint]
shell = "bash -c"
description = "Format-check and clang-tidy"
run = [
  "git ls-files -z -co --exclude-standard '*.cpp' '*.hpp' | xargs -0 -r clang-format --dry-run --Werror",
  "cmake --preset dev",
  "git ls-files -z -co --exclude-standard '*.cpp' | xargs -0 -r clang-tidy -p build/dev --quiet",
]

[tasks.fmt]
shell = "bash -c"
description = "Auto-format"
run = "git ls-files -z -co --exclude-standard '*.cpp' '*.hpp' | xargs -0 -r clang-format -i"

# ─── Commits ────────────────────────────────────────────────────────────────

[tasks.check-commits]
shell = "bash -c"
description = "Verify commits since origin/master are conventional"
# Before the first push there is no origin/master: check the whole history.
run = '''
if git rev-parse -q --verify origin/master >/dev/null; then
  cog check origin/master..HEAD
else
  cog check
fi
'''

# ─── GitHub repo config ─────────────────────────────────────────────────────

[tasks."repo:apply-settings"]
description = "Apply GitHub repo + branch-protection settings from .github/*.json, turn on Dependabot security updates"
run = "bash scripts/apply-github-settings.sh"

[tasks."repo:check-settings"]
description = "Diff live branch protection against .github/branch-protection.json, check security settings"
run = "bash scripts/apply-github-settings.sh --check"
