[project]
name = "pinsel-sidecar"
version = "0.1.0"
description = "Runs diffusion models for pinsel, over JSON Lines on stdin and stdout"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = []

# pinsel starts the sidecar with this extra. The tests run without it, so CI
# never downloads torch.
[project.optional-dependencies]
diffusers = [
  "accelerate>=1.0",
  "diffusers>=0.32",
  "safetensors>=0.4",
  "torch>=2.5",
  "transformers>=4.45",
]

[project.scripts]
pinsel-sidecar = "pinsel_sidecar.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyPI's torch wheels for Windows run on the CPU only.
[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
